name: update-prices

on:
  schedule:
    - cron: "0 13 * * *" # daily snapshot
  workflow_dispatch:
    inputs:
      zip:
        description: "ZIP code to snapshot"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull this week's grocery ads
        run: node tools/fetch-flipp.mjs
        env:
          PRICE_ZIP: ${{ inputs.zip || vars.PRICE_ZIP || '84101' }}
      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- prices.json; then
            echo "no change"
          else
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add prices.json
            git commit -m "Update weekly ad snapshot"
            git push
          fi
